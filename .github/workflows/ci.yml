# ShellCheck on the shell scripts, Ruff (pyflakes + pycodestyle errors, see
# pyproject.toml) on the Python files, and pytest for the display-free code
# (element detection, rendering, cache handling, the script's subcommands).
# Nothing here needs a display or Hyprland, so it runs on a plain Ubuntu
# runner; the GTK bindings come from apt because pip cannot build PyGObject
# without the GObject introspection headers.
#
# Robustness choices:
# - actions are pinned to commit SHAs (the tag is in the comment), and the
#   Ruff version is pinned too, so an upstream release cannot turn main red
# - the linters and the tests are separate jobs, so one failing never hides another
# - the token is read-only and a newer push cancels an older run
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # a pinned ShellCheck from PyPI rather than whatever the runner image
      # ships (findings differ between versions); no third-party action needed
      - run: pipx run --spec shellcheck-py==0.11.0.1 shellcheck --version
      - run: pipx run --spec shellcheck-py==0.11.0.1 shellcheck snip-pin.sh install.sh

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.5"
          args: check .

  pytest:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends
             python3-gi python3-gi-cairo gir1.2-gtk-4.0 python3-numpy python3-pytest
      - run: python3 -m pytest -q
