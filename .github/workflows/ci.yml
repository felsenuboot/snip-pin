name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Catches Bash script bugs
      - name: Lint Bash (ShellCheck)
        uses: ludeeus/action-shellcheck@master

      # 2. Catches Python syntax errors, unused imports, and typos
      - name: Lint Python (Ruff)
        uses: astral-sh/ruff-action@v1
        with:
          args: 'check .'
