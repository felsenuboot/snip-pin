    <path d="M22 44 V30 H36"/>
    <path d="M92 30 H106 V44"/>
    <path d="M22 84 V98 H36"/>
    <path d="M92 98 H106 V84"/>
  </g>
  <!-- pushpin -->
  <g transform="translate(64 30) rotate(35)">
    <path d="M-10 -20 H10 L7 -4 H-7 Z" fill="url(#pin)"/>
    <rect x="-13" y="-24" width="26" height="6" rx="3" fill="#2f7fe5"/>
