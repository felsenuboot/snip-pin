[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pyflakes (F: undefined names, unused imports, ...) and pycodestyle errors
# (E). Formatting is deliberately not enforced; the code is written in a
# compact style on purpose.
select = ["E", "F"]
ignore = [
    "E402",  # imports not at top: the socket hand-over and gi.require_version must run before the GTK imports
    "E701",  # multiple statements on one line (if x: y)
    "E702",  # multiple statements on one line (x; y)
]
